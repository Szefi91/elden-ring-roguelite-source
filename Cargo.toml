[package]
name = "er-roguelite"
version = "0.1.10"
edition = "2021"
description = "Elden Ring roguelite mode: auto-level on rune threshold + card draft"

[lib]
crate-type = ["cdylib"]

# Companion injector: loads er_roguelite.dll into a running (offline) eldenring.exe.
[[bin]]
name = "er-inject"
path = "src/bin/inject.rs"

[dependencies]
# D3D12 Dear ImGui overlay engine (present-hook done for us) + DLL injector helper.
hudhook = { version = "0.9.3", features = ["dx12", "inject"], default-features = false }
imgui = "0.12.0"
once_cell = "1.19"
parking_lot = "0.12"
tracing = "0.1"
png = "0.17"  # decode the card-frame PNGs to RGBA for the overlay textures
serde_json = "1"  # parse the embedded card pool (names/descriptions/item ids)
retour = "0.3"  # inline detour (GenericDetour) for XInputGetState: block the pad from the GAME while a draft is open
# Game structures + singletons for Elden Ring 2.7.2.0 (version-detected at runtime).
eldenring = "0.14.0"
fromsoftware-shared = "0.14.0"

[dependencies.windows]
version = "0.62.0"
features = [
  "Win32_Foundation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
strip = "symbols"
lto = true
